# Steeper yard for drain / bank demos. Same robot; more micro-terrain.
dt: 0.10
max_steps: 500

robot:
  length_m: 0.70
  width_m: 0.70
  height_m: 0.40
  wheelbase_m: 0.55
  track_m: 0.55
  max_wheel_speed_mps: 1.2
  collision_radius_m: 0.40
  tip_roll_rad: 0.55
  tip_pitch_rad: 0.55
  h_cg_m: 0.14
  software_tip_frac: 0.50
  wheel_drop_m: 0.08
  steep_slope_rad: 0.28
  trimmer:
    offset_m: 0.42
    radius_m: 0.16
    safety_radius_m: 1.50
    height_m: 0.12

sensors:
  width: 80
  height: 60
  camera_count: 6
  fov_deg: 70.0
  cameras: []
  imu:
    enabled: true
    accel_noise_std: 0.05
    gyro_noise_std: 0.015
    accel_bias_std: 0.02
  gps:
    enabled: true
    horiz_noise_std_m: 1.2
    vert_noise_std_m: 2.0
    dropout_prob: 0.02
    include_altitude: true
  tof:
    enabled: true
    noise_std_m: 0.012
    max_range_m: 1.2

world:
  width_m: 12.0
  height_m: 12.0
  resolution_m: 0.10
  n_people: 1
  n_dogs: 0
  n_cats: 0
  n_birds: 0
  n_trees: 2
  n_furniture: 0
  n_toys: 0
  terrain:
    enabled: true
    n_drains: 3
    n_banks: 3
    drain_width_m: 0.45
    drain_depth_m: 0.20
    drain_length_m: 4.5
    drain_side_slope: 1.8
    bank_height_m: 0.48
    bank_width_m: 1.6
    bank_length_m: 3.8
    max_slope_rad: 0.50
    noise_amp_m: 0.02
    keepout_m: 1.8
    base_gradient:
      slope_rad: 0.10
      yaw_rad: 0.70
      undulation_m: 0.06

reward:
  coverage_scale: 1.0
  time_penalty: 0.01
  collision_living: 50.0
  collision_static: 20.0
  out_of_bounds: 10.0
  completion_bonus: 15.0
  completion_threshold: 0.95
  tipover: 40.0
  drain_drop: 30.0
  steep: 2.0

curriculum:
  hand_signals: false
  signal_hold_steps: 40

perception:
  terrain_mode: heuristic

planner:
  max_climb_slope_rad: 0.30
  drain_clearance_m: 0.45
  slow_speed_factor: 0.30
  strip_spacing_m: 0.28
  waypoint_stride_m: 0.32
  cruise_speed: 0.50
  pose_filter: ekf
  uncertainty:
    inflate: 1.8
    hazard_boost: 5.0
    confidence_floor: 0.25
