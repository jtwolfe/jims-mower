# Example real-rig extrinsics for a 4–6 camera Orin install.
# Same CameraSpec fields the gym already uses (body frame: x forward, y left, z up).
# Copy, measure, and replace the numbers. This is not a calibrated field file.

sensors:
  width: 80
  height: 60
  camera_count: 6
  fov_deg: 70.0
  cameras:
    - {name: front,       x: 0.25, y:  0.00, z: 0.38, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: front_left,  x: 0.20, y:  0.20, z: 0.38, yaw_deg:  40.0, pitch_deg: -18.0, fov_deg: 70.0}
    - {name: front_right, x: 0.20, y: -0.20, z: 0.38, yaw_deg: -40.0, pitch_deg: -18.0, fov_deg: 70.0}
    - {name: rear,        x: -0.25, y:  0.00, z: 0.38, yaw_deg: 180.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: left,        x:  0.00, y:  0.25, z: 0.38, yaw_deg:  90.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: right,       x:  0.00, y: -0.25, z: 0.38, yaw_deg: -90.0, pitch_deg: -12.0, fov_deg: 70.0}
