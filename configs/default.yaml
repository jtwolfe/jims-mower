# Default yard + robot for the Jim's Mower gym.
# Distances are metres. Body is ~50 x 50 x 50 cm; cameras are body-frame
# (x forward, y left, z up) with yaw/pitch in degrees.

dt: 0.10
max_steps: 500

robot:
  length_m: 0.50
  width_m: 0.50
  height_m: 0.50
  wheelbase_m: 0.40
  track_m: 0.40
  max_wheel_speed_mps: 1.2
  collision_radius_m: 0.28
  tip_roll_rad: 0.40
  tip_pitch_rad: 0.45
  wheel_drop_m: 0.08
  steep_slope_rad: 0.30
  drive:
    # 1.0 command → max_wheel_speed_mps * scale. measured: false until tape.
    # See docs/SCALE.md. Do not invent Kv.
    scale: 1.0
    measured: false
  trimmer:
    # Front-mounted whipper-snipper, not an under-deck blade.
    offset_m: 0.32
    radius_m: 0.16
    safety_radius_m: 1.50
    height_m: 0.12
    # 1.0 command → measured RPM * scale. measured: false until tach.
    scale: 1.0
    measured: false

sensors:
  width: 80
  height: 60
  # 4, 5, or 6 RGB cameras. Leave `cameras` empty to use the default rig.
  camera_count: 6
  fov_deg: 70.0
  cameras: []
  imu:
    enabled: true
    accel_noise_std: 0.05
    gyro_noise_std: 0.015
    accel_bias_std: 0.02
  gps:
    enabled: true
    horiz_noise_std_m: 1.2
    vert_noise_std_m: 2.0
    dropout_prob: 0.02
    include_altitude: true
  tof:
    enabled: true
    count: 4
    noise_std_m: 0.012
    max_range_m: 1.2

world:
  width_m: 12.0
  height_m: 12.0
  resolution_m: 0.10
  n_people: 1
  n_dogs: 1
  n_cats: 1
  n_birds: 1
  n_trees: 3
  n_furniture: 1
  n_toys: 2
  terrain:
    enabled: true
    n_drains: 2
    n_banks: 2
    drain_width_m: 0.40
    drain_depth_m: 0.16
    drain_length_m: 4.0
    drain_side_slope: 1.5
    bank_height_m: 0.40
    bank_width_m: 1.8
    bank_length_m: 3.5
    max_slope_rad: 0.45
    noise_amp_m: 0.015
    keepout_m: 1.6
    # Whole-yard planar grade (not a flat pad). Drains/banks carve on top.
    # 0.05 rad ≈ 5% / 2.9°. yaw_rad is the direction of ascent.
    base_gradient:
      slope_rad: 0.05
      yaw_rad: 0.55
      undulation_m: 0.04

reward:
  coverage_scale: 1.0
  time_penalty: 0.01
  collision_living: 50.0
  collision_static: 20.0
  out_of_bounds: 10.0
  completion_bonus: 15.0
  completion_threshold: 0.95
  tipover: 40.0
  drain_drop: 30.0
  steep: 2.0

curriculum:
  hand_signals: false
  signal_hold_steps: 40

perception:
  # heuristic: RGB + ToF drain/bank maps (demo default). oracle: god-view
  # for training. blind: empty stub. learned: exporter-trained numpy stub.
  # onnx / trt: load a sim_only graph / engine if present, else fall back.
  # Not field-ready. iou_claim / map_claim / fps_claim stay null.
  terrain_mode: heuristic
  weights_path: ""
  onnx_path: ""
  temporal: false
  # color: palette uncut fraction (default). class: terrain-seg grass vs
  # non-grass when labels exist, colour fallback. feature: 6-stat mix.
  grass_mode: color
  # Phone cut % source. gym_grid is the live default (god-view grass
  # raster). observer is opt-in CV-2 BEV — still not a field strip test.
  coverage_source: gym_grid
  detector_backend: mock
  # auto: detections when appearance/onnx/blind; obstacles when mock
  interlock_source: auto

planner:
  # Coverage planner + controller. Steep below max_climb is a slow corridor.
  # Between max_climb and tip_lethal_frac * tip_roll: high contour cost (not
  # blocked). Lethal only above that tip-safe margin. See docs/TIP_HILL.md.
  max_climb_slope_rad: 0.32
  tip_lethal_frac: 0.95
  contour_cost: 12.0
  imu_stop_hold_steps: 3
  imu_tilt_window: 5
  drain_clearance_m: 0.40
  slow_speed_factor: 0.35
  strip_spacing_m: 0.28
  waypoint_stride_m: 0.32
  cruise_speed: 0.55
  pose_filter: ekf
  ekf:
    q_xy: 0.04
    q_z: 0.08
    q_yaw: 0.03
    q_tilt: 0.04
    q_odom: 0.06
    r_gps_xy: 1.2
    r_gps_z: 2.0
    r_tilt: 0.10
    use_gps_z: true
    gps_gate_m: 5.0
    gyro_yaw_mix: 0.30
  uncertainty:
    inflate: 1.5
    hazard_boost: 4.0
    confidence_floor: 0.25
  # WAVE 2A — living / geofence / recovery (defaults also live on PlannerConfig)
  living_slow_m: 3.0
  living_reroute_m: 1.8
  living_stop_m: 0.90
  geofence_inflate_m: 0.30
  recovery_trigger: 3
  max_recoveries: 2
  safe_state:
    limp_after_stops: 8
    safe_after_limp_steps: 12
    limp_scale: 0.35
    recover_ok_steps: 4
  blend_elevation_prior: true
  elevation_prior_weight: 0.55
  path_cost: 8.0
  bunker_cost: 12.0

# Calibrate → explore → review → mow. Unknown cells are not mowable.
mission:
  observe_confidence: 0.35
  explore_complete: 0.80
  explore_no_frontier: 0.55
  stamp_radius_m: 1.35
  camera_range_m: 6.0
  max_calibrate_steps: 900
  max_explore_steps: 2800
  max_mow_steps: 5500
  max_return_steps: 500
  snapshot_stride: 25

# WAVE 3B — Orin-class battery / thermal stub. Off by default so short
# gym tests do not limp. Enable to scale / stop the policy when hot or empty.
# Bench watchdog: set runtime.watchdog.enabled true (configs/orin/bench.yaml).
# CSI adapter: "" / renderer (gym), fake_csi / fake_gst (CI), gst (raises
# without JetPack). Downsample: runtime.capture.downsample_rgb.
runtime:
  enabled: false
  cameras:
    adapter: ""
  watchdog:
    enabled: false
    imu_stall_s: 0.40
    vision_stall_s: 0.40
  battery:
    # 50 Wh is the gym stub. measured: false until docs/PACK_THERMAL.md.
    # Do not flip measured: true without capacity_wh / charge_time_h / measured_at.
    capacity_wh: 50.0
    charge_time_h: null
    measured: false
    template: false
    measured_at: ""
    notes: ""
    soc: 1.0
    limp_soc: 0.15
    stop_soc: 0.05
  thermal:
    t_c: 45.0
    t_ambient_c: 35.0
    t_hot_c: 75.0
    t_crit_c: 85.0
    board_load_c: null
    measured: false

# WAVE UX-B — fault injection + radio sim. Off by default.
faults:
  enabled: false
  inject: []
# Live owner / field-dryrun overlay sets require_pair: true.
# Gym unit tests leave the default false so Start still works unpaired.
owner:
  require_pair: false
  pair_pin: "2468"
radio:
  enabled: false
  distance_m: 10.0
  heartbeat_timeout_s: 2.0
  on_loss: stop_beacon
  wifi:
    bandwidth_bps: 20000000.0
    range_m: 40.0
    drop_prob: 0.02
  bt:
    bandwidth_bps: 1000000.0
    range_m: 12.0
    drop_prob: 0.08
  lora:
    bandwidth_bps: 5000.0
    range_m: 2000.0
    drop_prob: 0.15
