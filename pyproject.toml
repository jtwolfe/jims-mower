[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jims-mower"
version = "0.1.0"
description = "Gymnasium environment for a camera-driven zero-turn string-trimmer mower."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jim Wolfe" }]
keywords = ["gymnasium", "robotics", "mower", "computer-vision", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
torch = [
    "torch>=2.1",
]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.1",
]
# Marker extra. rclpy comes from a ROS 2 distro, not PyPI / this extra.
ros2 = []

[project.scripts]
jims-mower-demo = "jims_mower.demo:main"
jims-mower-train-terrain = "jims_mower.perception.train:main"
jims-mower-export = "jims_mower.export:main"
jims-mower-farm = "jims_mower.farm:main"
jims-mower-record = "jims_mower.record_cli:main"
jims-mower-replay = "jims_mower.replay_cli:main"
jims-mower-mission = "jims_mower.mission:main"
jims-mower-mission-demo = "jims_mower.mission_demo:main"
jims-mower-bc = "jims_mower.bc_cli:main"
jims-mower-rl = "jims_mower.rl_cli:main"
jims-mower-incident = "jims_mower.incident_cli:main"
jims-mower-telemetry = "jims_mower.telemetry_cli:main"
jims-mower-owner = "jims_mower.owner_cli:main"
jims-mower-bridge = "jims_mower.runtime.bridge:main"
jims-mower-study = "jims_mower.studies:main"
jims-mower-export-trt = "jims_mower.runtime.export_trt:main"
jims-mower-sequence = "jims_mower.sequence:main"
jims-mower-curriculum = "jims_mower.curriculum_sched:main"
jims-mower-import-yard = "jims_mower.survey:main"
jims-mower-viewer = "jims_mower.viewer:main"
jims-mower-live = "jims_mower.live:main"
jims-mower-mesh = "jims_mower.mesh:main"
jims-mower-teach = "jims_mower.teach:main"
jims-mower-selftest = "jims_mower.selftest:main"
jims-mower-calibrate = "jims_mower.calibrate_cli:main"
jims-mower-app = "jims_mower.app.cli:main"

[project.urls]
Homepage = "https://github.com/jtwolfe/jims-mower"
Repository = "https://github.com/jtwolfe/jims-mower"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jims_mower = [
    "py.typed",
    "data/default.yaml",
    "data/scenarios/*.yaml",
    "data/overlays/*.yaml",
    "data/curriculum/*.yaml",
    "data/sequences/*.yaml",
    "data/orin/*.yaml",
    "data/surveys/*.json",
    "data/yards/*.json",
    "data/dem/*.npy",
    "viewer_static/*",
    "app/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
