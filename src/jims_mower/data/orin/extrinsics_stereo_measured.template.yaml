# MEASURED TEMPLATE — placeholder numbers, not taped hardware.
# Copy to extrinsics_stereo_measured.yaml after the bench in docs/CALIBRATION.md.
# Then: replace every pose, set template: false, fill tape_baseline_cm and
# measured_at. Do not commit this file renamed until the numbers are measured.
#
# Body frame: x forward, y left, z up.
# Forward stereo baseline must stay in the 6–12 cm band.
# Live control: near-field disparity 0.8–4 m. Not COLMAP. fps_claim null.

calibration:
  measured: true
  template: true
  measured_at: ""          # ISO date after the bench, e.g. 2026-09-16
  tape_baseline_cm: null   # fill with the taped optical-centre distance
  notes: "TEMPLATE. Replace poses before treating as MEASURED."

sensors:
  width: 80
  height: 60
  camera_count: 6
  fov_deg: 70.0
  cameras:
    - {name: stereo_left,  x: 0.33, y:  0.04, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: stereo_right, x: 0.33, y: -0.04, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: front,        x: 0.33, y:  0.00, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: rear,         x: -0.33, y:  0.00, z: 0.34, yaw_deg: 180.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: left,         x:  0.00, y:  0.33, z: 0.34, yaw_deg:  90.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: right,        x:  0.00, y: -0.33, z: 0.34, yaw_deg: -90.0, pitch_deg: -12.0, fov_deg: 70.0}
