# EXAMPLE — not a measured calibration.
# Copy to extrinsics_stereo_measured.yaml, replace every pose with tape /
# checkerboard numbers, set calibration.measured: true.
# See docs/CALIBRATION.md.
#
# Preferred field rig for a ~0.70 × 0.40 m zero-turn: calibrated forward
# stereo (~8 cm baseline, inside the 6–12 cm band) + side/rear mono.
# Camera z stays under the 0.40 m lid.
# Body frame: x forward, y left, z up.
#
# The default gym 6-cam look-around (front_left/right at ±40° / ±20 cm)
# is NOT a stereo pair — find_stereo_pair rejects it.
#
# Live control uses near-field disparity in the 0.8–4 m band.
# Not COLMAP. Not a full-yard SfM DEM. fps_claim / map_claim stay null.

calibration:
  measured: false
  template: false
  measured_at: ""
  tape_baseline_cm: null
  notes: "EXAMPLE poses. Do not treat as taped hardware."

sensors:
  width: 80
  height: 60
  camera_count: 6
  fov_deg: 70.0
  cameras:
    - {name: stereo_left,  x: 0.33, y:  0.04, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: stereo_right, x: 0.33, y: -0.04, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: front,        x: 0.33, y:  0.00, z: 0.34, yaw_deg:   0.0, pitch_deg: -22.0, fov_deg: 70.0}
    - {name: rear,         x: -0.33, y:  0.00, z: 0.34, yaw_deg: 180.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: left,         x:  0.00, y:  0.33, z: 0.34, yaw_deg:  90.0, pitch_deg: -12.0, fov_deg: 70.0}
    - {name: right,        x:  0.00, y: -0.33, z: 0.34, yaw_deg: -90.0, pitch_deg: -12.0, fov_deg: 70.0}
