# jims-mower scenario DSL (WAVE 1A). Not loaded as a yard — documentation only.
# Loader: jims_mower.scenarios.load_scenario / MowerEnv(config=<this file>)
#
# kind: scenario          required for detection (or name + weather/geofence/...)
# name: <id>              required, used by the farm registry
# description: <text>
# base: default | steep_yard | path.yaml
# weather:
#   lighting: day | dawn | night     # or booleans night / dawn
#   wet: false                       # surface flag; planner adds wet-slope cost
# season: none | long_grass | leaf_clutter
# geofence: [[x, y], ...]            # keep-in ≥3 vertices (legacy)
# geofence:                          # or structured keep-in / keep-out
#   keep_in: [[x, y], ...]
#   keep_out:
#     - [[x, y], ...]
# keepout:                           # extra no-go polygons (same as keep_out)
#   - [[x, y], ...]
# drains:                            # explicit channels (metres)
#   - {x0, y0, x1, y1, width_m, depth_m, side_slope}
# banks:
#   - {x0, y0, x1, y1, width_m, height_m}
# obstacles:
#   - {kind: tree|person|dog|cat|bird|furniture|toy, x, y, radius?, heading?,
#      trajectory?: {mode: wander|patrol|loop|line, waypoints: [[x,y],...], speed_mps?}}
# world / robot / sensors / planner / mission / perception / reward / env:
#   same keys as EnvConfig (merged onto `base`)
# mission:
#   explore_complete, stamp_radius_m, max_*_steps — calibrate→explore→mow
#   calibrate_stride_m / calibrate_cruise / calibrate_arrive_m — 0 = auto
#   calibrate_confirm_m — demo: close after N metres, use authored keep-in
#   phase_budget_scale — live --phase-budget (does not change physics)
#   review_hold_steps — MAP READY beat before auto-mow (owner Start mow skips)
#   explore_complete on acre_yard_demo is a demo threshold (0.42), not the
#   honest full-acre 0.72 on acre_yard
# world.terrain.base_gradient:
#   slope_rad / slope_pct, yaw_rad (ascent heading), undulation_m
#   Default yards are a mild planar grade, not a flat pad. The curriculum
#   `flat` scenario zeros this. Drains/banks carve on top of the tilt.
# world.terrain.multi_scale_amp_m / swale_amp_m:
#   Extra undulation for golf_rough / golf_fairway (not a single plane).
# world.terrain.dem_path:
#   Optional vendored .npy height patch (resampled, mean-centered). No
#   ELVIS / OpenTopography / SRTM download in CI. Packaged stub:
#   jims_mower.terrain.bundled_dem_path() → data/dem/tiny_patch.npy.
# paths:                             # paved ribbons (no-mow, high cost)
#   - {vertices: [[x, y], ...], width_m: 1.2, kind: path_paved}
# buildings:                         # polygons (blocked, no-mow)
#   - {vertices: [[x, y], ...], kind: building, height_m?}
# bunkers:                           # sand bowls (blocked, no-mow)
#   - {x, y, radius_m, depth_m}
# garden_beds / greens:              # polygons (blocked, no-mow / no-trimmer)
#   - {vertices: [[x, y], ...], kind: garden_bed|green}
# ponds:                             # water keep-out (not a hydro simulator)
#   - {vertices: [[x, y], ...], kind: pond, depth_m?}
#   Painted as standing water, merged into geofence keep-out, excluded
#   from coverage. Pair with n_puddles / drains for leftover wet spots.
#
# Random spawn counts still apply (world.n_trees, …) after explicit obstacles.
# Set those counts to 0 when the authored list should be the only objects.

kind: scenario
name: _schema
description: Annotated template — skipped by list_scenarios()
weather:
  lighting: day
  wet: false
geofence: []
drains: []
banks: []
obstacles: []
