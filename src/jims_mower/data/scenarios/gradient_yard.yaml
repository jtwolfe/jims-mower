# Whole-yard planar slope with a drain crossing the grade.
# Ascent is +x (yaw 0). The channel runs along y so it cuts across the tilt.
kind: scenario
name: gradient_yard
description: Clear property-scale grade with one drain crossing the slope.
base: default
weather:
  lighting: day
  wet: false
geofence:
  - [0.7, 0.7]
  - [11.3, 0.7]
  - [11.3, 11.3]
  - [0.7, 11.3]
world:
  layout: random
  width_m: 12.0
  height_m: 12.0
  resolution_m: 0.10
  n_people: 0
  n_dogs: 0
  n_cats: 0
  n_birds: 0
  n_trees: 1
  n_furniture: 0
  n_toys: 0
  n_hoses: 0
  n_cords: 0
  n_puddles: 0
  terrain:
    enabled: true
    n_drains: 0
    n_banks: 0
    noise_amp_m: 0.010
    keepout_m: 1.6
    base_gradient:
      slope_rad: 0.14
      yaw_rad: 0.0
      undulation_m: 0.05
drains:
  - {x0: 8.2, y0: 1.6, x1: 8.2, y1: 10.4, width_m: 0.45, depth_m: 0.18, side_slope: 1.5}
obstacles:
  - {kind: tree, x: 2.2, y: 10.2}
perception:
  terrain_mode: heuristic
planner:
  max_climb_slope_rad: 0.32
  drain_clearance_m: 0.42
  slow_speed_factor: 0.35
  cruise_speed: 0.50
