# Suburban/rural ~1-acre block. 0.25 m cells so the chassis (~0.70 / 0.55 m)
# spans more than one height sample — 0.50 m aliased drain lips / ridges.
# 70 × 58 m @ 0.25 m → 280×232 = 64,960 cells. Not a claimed coverage benchmark.
# 70 × 58 m = 4060 m² ≈ 1.003 acre (1 acre = 4046.86 m²).
kind: scenario
name: acre_yard
description: >
  One-acre explore/mow yard (70×58 m @ 0.25 m): tree clusters, bush beds,
  sand bowls, paved paths, sheds, a pond keep-out, drains, and uneven
  ground. Pond is a visible water polygon + geofence keep-out — not a
  hydro simulator.
base: default
weather:
  lighting: day
  wet: false
geofence:
  - [1.6, 1.6]
  - [68.4, 1.6]
  - [68.4, 56.4]
  - [1.6, 56.4]
world:
