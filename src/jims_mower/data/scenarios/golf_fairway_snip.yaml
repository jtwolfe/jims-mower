# Short fairway clip: gentler undulation, cart-path ribbon, bunker, green keep-out.
kind: scenario
name: golf_fairway_snip
description: Fairway snip with a hard cart path, sand bunker, and no-mow green.
base: default
weather:
  lighting: day
  wet: false
geofence:
  - [0.6, 0.6]
  - [9.4, 0.6]
  - [9.4, 9.4]
  - [0.6, 9.4]
world:
  layout: golf_fairway
  width_m: 10.0
  height_m: 10.0
  resolution_m: 0.10
  n_people: 0
  n_dogs: 0
  n_cats: 0
  n_birds: 0
  n_trees: 1
  n_furniture: 0
  n_toys: 0
  n_hoses: 0
  n_cords: 0
  n_puddles: 0
  terrain:
    enabled: true
    n_drains: 0
    n_banks: 0
    noise_amp_m: 0.012
    keepout_m: 1.4
    multi_scale_amp_m: 0.07
    swale_amp_m: 0.06
    base_gradient:
      slope_rad: 0.03
      yaw_rad: -0.4
      undulation_m: 0.04
paths:
  - width_m: 1.05
    kind: path_paved
    vertices:
      - [1.0, 4.8]
      - [4.2, 5.1]
      - [7.4, 4.4]
      - [9.2, 3.2]
bunkers:
  - {x: 3.2, y: 7.4, radius_m: 1.25, depth_m: 0.20}
greens:
  - kind: green
    vertices:
      - [6.6, 7.2]
      - [8.8, 7.2]
      - [8.8, 9.0]
      - [6.6, 9.0]
obstacles:
  - {kind: tree, x: 1.6, y: 1.8}
perception:
  terrain_mode: heuristic
planner:
  max_climb_slope_rad: 0.34
  blend_elevation_prior: true
  path_cost: 8.0
  bunker_cost: 12.0
