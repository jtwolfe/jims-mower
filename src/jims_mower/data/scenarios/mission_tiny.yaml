# CI / --fast mission yard. Small enough to finish calibrate→mow in hundreds of steps.
kind: scenario
name: mission_tiny
description: Tiny keep-in with a short path and shed for mission-flow smoke.
base: default
weather:
  lighting: day
  wet: false
geofence:
  - [0.35, 0.35]
  - [5.65, 0.35]
  - [5.65, 4.65]
  - [0.35, 4.65]
world:
  layout: suburban
  width_m: 6.0
  height_m: 5.0
  resolution_m: 0.20
  n_people: 0
  n_dogs: 0
  n_cats: 0
  n_birds: 0
  n_trees: 0
  n_furniture: 0
  n_toys: 0
  n_hoses: 0
  n_cords: 0
  n_puddles: 0
  terrain:
    enabled: true
    n_drains: 0
    n_banks: 0
    noise_amp_m: 0.0
    keepout_m: 0.9
    base_gradient:
      slope_rad: 0.0
      yaw_rad: 0.0
      undulation_m: 0.0
paths:
  - width_m: 0.50
    kind: path_paved
    vertices:
      - [1.0, 3.35]
      - [3.4, 3.45]
buildings:
  - kind: building
    height_m: 0.16
    vertices:
      - [3.6, 1.7]
      - [4.5, 1.7]
      - [4.5, 2.6]
      - [3.6, 2.6]
obstacles: []
perception:
  terrain_mode: heuristic
planner:
  max_climb_slope_rad: 0.34
  drain_clearance_m: 0.24
  strip_spacing_m: 0.40
  waypoint_stride_m: 0.45
  cruise_speed: 0.85
mission:
  explore_complete: 0.58
  explore_no_frontier: 0.38
  stamp_radius_m: 2.3
  camera_range_m: 5.0
  max_calibrate_steps: 220
  max_explore_steps: 200
  max_mow_steps: 240
  max_return_steps: 70
  snapshot_stride: 10
