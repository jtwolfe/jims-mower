name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Headless demo smoke
        run: jims-mower-demo --steps 4 --out /tmp/jims-mower-ci-demo --cameras 4 --policy terrain --terrain-observer heuristic
      - name: Scenario demo smoke
        run: jims-mower-demo --config configs/scenarios/suburban.yaml --steps 3 --out /tmp/jims-mower-ci-suburban --cameras 4 --policy scripted --terrain-observer heuristic
      - name: Record / replay smoke
        run: |
          jims-mower-record --out /tmp/jims-mower-ci-ep --steps 2 --cameras 4 --policy terrain
          jims-mower-replay /tmp/jims-mower-ci-ep --mode offline --out /tmp/jims-mower-ci-rep
          jims-mower-replay /tmp/jims-mower-ci-ep --mode env
          jims-mower-bridge /tmp/jims-mower-ci-ep --out /tmp/jims-mower-ci-bridge.json
      - name: Design-study dry-run
        run: |
          jims-mower-study --dry-run --out /tmp/jims-mower-ci-study
          jims-mower-study --kind pitch --dry-run --out /tmp/jims-mower-ci-study-pitch
          jims-mower-study --kind clearance --dry-run --out /tmp/jims-mower-ci-study-clear
          jims-mower-study --kind trimmer --dry-run --out /tmp/jims-mower-ci-study-trim
          jims-mower-study --kind observer --dry-run --out /tmp/jims-mower-ci-study-obs
      - name: TensorRT placeholder dry-run
        run: jims-mower-export-trt --dry-run --out /tmp/jims-mower-ci-trt.json
      - name: Geofence + movers demo smoke
        run: jims-mower-demo --config configs/scenarios/geofence_movers.yaml --steps 4 --out /tmp/jims-mower-ci-geofence --cameras 4 --policy terrain
      - name: Mission resume smoke
        run: |
          jims-mower-demo --steps 4 --cameras 4 --policy scripted --out /tmp/jims-mower-ci-mission-a --save-mission /tmp/jims-mower-ci-mission.npz
          jims-mower-mission inspect --in /tmp/jims-mower-ci-mission.npz
      - name: Behaviour cloning smoke
        run: |
          jims-mower-bc collect --steps 4 --cameras 4 --seed 1 --out /tmp/jims-mower-ci-bc
          jims-mower-bc train --in /tmp/jims-mower-ci-bc --out /tmp/jims-mower-ci-bc.npz --epochs 8
          jims-mower-demo --steps 3 --cameras 4 --policy bc --bc-weights /tmp/jims-mower-ci-bc.npz --out /tmp/jims-mower-ci-bc-demo
      - name: RL CPU smoke
        run: jims-mower-rl --smoke --algo reinforce --episodes 1 --steps 4
      - name: Incident + telemetry smoke
        run: |
          jims-mower-incident /tmp/jims-mower-ci-ep --out /tmp/jims-mower-ci-incident
          jims-mower-telemetry /tmp/jims-mower-ci-ep --out /tmp/jims-mower-ci-telemetry.json
      - name: Owner overlay smoke
        run: jims-mower-owner --config geofence_movers --cameras 4 --out /tmp/jims-mower-ci-owner.html
      - name: Owner app CLI smoke
        run: jims-mower-app --help
      - name: WAVE 4 hooks smoke
        run: |
          jims-mower-sequence --yards paddock,suburban --dry-run --out /tmp/jims-mower-ci-seq
          jims-mower-curriculum --out /tmp/jims-mower-ci-curr.json
          jims-mower-import-yard configs/surveys/example_yard.json
          jims-mower-farm --dry-run --scenarios suburban --quarantine playground --out /tmp/jims-mower-ci-farm-q
          jims-mower-demo --config configs/scenarios/narrow_gate.yaml --steps 3 --out /tmp/jims-mower-ci-gate --cameras 4 --policy scripted
          jims-mower-demo --config configs/orin/extrinsics_6cam.yaml --steps 2 --out /tmp/jims-mower-ci-ext --policy scripted
      - name: Mission flow smoke
        run: |
          jims-mower-mission-demo --fast --out /tmp/jims-mower-ci-mission --cameras 4
          test -f /tmp/jims-mower-ci-mission/mission.json
          test -f /tmp/jims-mower-ci-mission/viewer.json
          jims-mower-live --fast --speed max --steps 24 --prepare-only --out /tmp/jims-mower-ci-live --cameras 4
          test -f /tmp/jims-mower-ci-live/viewer.json
          test -f /tmp/jims-mower-ci-live/maps/fog.png
          test -f /tmp/jims-mower-ci-live/maps/observed.png
      - name: World Viewer + Teach Boundary smoke
        run: |
          jims-mower-mesh --out /tmp/jims-mower-ci-yard.glb --cameras 4 --seed 1 --stride 3
          test -s /tmp/jims-mower-ci-yard.glb
          jims-mower-viewer --episode /tmp/jims-mower-ci-demo --prepare-only
          test -s /tmp/jims-mower-ci-demo/yard.glb
          test -f /tmp/jims-mower-ci-demo/viewer.json
          jims-mower-teach --steps 6 --cameras 4 --out /tmp/jims-mower-ci-teach
          test -f /tmp/jims-mower-ci-teach/profile.json
          jims-mower-demo --policy teach --steps 4 --cameras 4 --out /tmp/jims-mower-ci-teach-demo
          jims-mower-demo --profile /tmp/jims-mower-ci-teach/profile.json --steps 3 --cameras 4 --out /tmp/jims-mower-ci-taught
      - name: UX-B self-test + fault/radio smoke
        run: |
          jims-mower-selftest --out /tmp/jims-mower-ci-selftest.json

