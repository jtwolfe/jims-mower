name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Headless demo smoke
        run: jims-mower-demo --steps 4 --out /tmp/jims-mower-ci-demo --cameras 4 --policy terrain --terrain-observer heuristic
